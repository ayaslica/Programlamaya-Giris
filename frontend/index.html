<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinAnalytica</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div class="max-w-7xl mx-auto p-4 space-y-4">
    <h1 class="text-2xl font-bold">FinAnalytica Dashboard</h1>

    <div class="grid grid-cols-3 gap-2 text-sm">
      <button class="tab-btn bg-slate-800 p-2 rounded" data-tab="analyze">Analyze</button>
      <button class="tab-btn bg-slate-800 p-2 rounded" data-tab="scan">Scan</button>
      <button class="tab-btn bg-slate-800 p-2 rounded" data-tab="backtest">Backtest</button>
    </div>

    <section id="analyze" class="tab">
      <div class="grid md:grid-cols-4 gap-2">
        <input id="analyzeSymbol" class="p-2 rounded bg-slate-900" value="BTC.USDT" />
        <select id="analyzeTf" class="p-2 rounded bg-slate-900"><option>1h</option><option>4h</option><option selected>1d</option></select>
        <select id="analyzePeriod" class="p-2 rounded bg-slate-900"></select>
        <button id="analyzeBtn" class="bg-blue-600 rounded p-2">Analyze</button>
      </div>
      <pre id="analyzeOut" class="bg-slate-900 p-3 rounded mt-3 overflow-auto text-xs"></pre>
    </section>

    <section id="scan" class="tab hidden">
      <div class="grid md:grid-cols-4 gap-2">
        <input id="scanSymbols" class="p-2 rounded bg-slate-900 col-span-2" value="BTC.USDT,ETH.USDT,AAPL.USD" />
        <select id="scanMode" class="p-2 rounded bg-slate-900"><option value="independent">Independent</option><option value="portfolio">Portfolio</option></select>
        <button id="scanBtn" class="bg-emerald-600 rounded p-2">Scan</button>
      </div>
      <pre id="scanOut" class="bg-slate-900 p-3 rounded mt-3 overflow-auto text-xs"></pre>
    </section>

    <section id="backtest" class="tab hidden space-y-3">
      <div class="grid md:grid-cols-4 gap-2">
        <input id="btSymbol" class="p-2 rounded bg-slate-900" value="BTC.USDT" />
        <select id="btTf" class="p-2 rounded bg-slate-900"><option>1h</option><option>4h</option><option selected>1d</option></select>
        <input id="btScore" class="p-2 rounded bg-slate-900" type="number" step="0.1" value="4" />
        <button id="btBtn" class="bg-purple-600 rounded p-2">Run Backtest</button>
      </div>

      <div id="kpis" class="grid grid-cols-2 md:grid-cols-6 gap-2"></div>
      <div class="grid md:grid-cols-2 gap-2">
        <div id="equityChart" class="bg-slate-900 rounded p-2"></div>
        <div id="ddChart" class="bg-slate-900 rounded p-2"></div>
      </div>
      <pre id="btOut" class="bg-slate-900 p-3 rounded overflow-auto text-xs"></pre>
    </section>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
